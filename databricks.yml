# This is a Declarative Automation Bundle definition for databricks_end_to_end_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_end_to_end_project
  uuid: 04978759-3f75-4c3c-bdc1-310a3e66f380

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  telematics_topic:
    description: Kafka topic the telematics simulator writes to and the pipeline reads from
    default: telematics
  telematics_source:
    description: Where telematics events travel, "files" (landing volume + Auto Loader) or "kafka" (Confluent Cloud)
    default: files

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-b5c9918e-c2d2.cloud.databricks.com
    variables:
      catalog: e2e_dev
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-b5c9918e-c2d2.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/keqingli1129@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/keqingli1129@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: e2e_prod
      schema: prod
    permissions:
      - user_name: keqingli1129@gmail.com
        level: CAN_MANAGE
