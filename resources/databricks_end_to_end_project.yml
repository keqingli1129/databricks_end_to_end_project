# The Unity Catalog objects for this project (schemas and volumes), all in ${var.catalog}.
# Managed by the bundle so they are created on deploy (and removed on `bundle destroy`).
# In dev, development mode prefixes each schema name with dev_<user>_.

resources:
  schemas:
    # Used by the template's sample job and pipeline.
    databricks_end_to_end_project_schema:
      catalog_name: ${var.catalog}
      name: ${var.schema}
      comment: Schema for databricks_end_to_end_project

    # Medallion architecture (see docs/transcript_1.txt).
    landing:
      catalog_name: ${var.catalog}
      name: landing
      comment: Raw files as they arrive, before conversion to Delta
    bronze:
      catalog_name: ${var.catalog}
      name: bronze
      comment: Source data stored as-is in Delta
    silver:
      catalog_name: ${var.catalog}
      name: silver
      comment: Cleaned and standardized data
    gold:
      catalog_name: ${var.catalog}
      name: gold
      comment: Aggregated and joined data, ready for BI

    # Stand-in for the transcript's SQL Server (see docs/transcript_2.txt).
    source:
      catalog_name: ${var.catalog}
      name: source
      comment: Source database stand-in - customer, policy, claim with Change Data Feed on

  volumes:
    # Raw files (e.g. simulator JSON) before they are ingested into Delta.
    landing_files:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.landing.name}
      name: files
      volume_type: MANAGED
      comment: Raw landing files, e.g. telematics JSON from the simulator
